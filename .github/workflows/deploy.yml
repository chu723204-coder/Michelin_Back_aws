name: backend deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x Michelin_Back/gradlew

      - name: build
        run: |
          cd Michelin_Back
          ./gradlew bootWar

      - name: SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > was.pem
          chmod 600 was.pem

      - name: upload war
        run: |
          scp -o StrictHostKeyChecking=no -i was.pem \
          Michelin_Back/build/libs/*.war \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~

      # [추가] 서버 자동 재시작 코드
      - name: Deploy and Restart Server
        run: |
          ssh -o StrictHostKeyChecking=no -i was.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # 1. 기존 실행 중인 프로세스 종료 (실행 중이 아니어도 에러 무시)
            pgrep -f Michelin_Back-0.0.1-SNAPSHOT.war | xargs kill -9 2>/dev/null || true
            
            # 2. 잠시 대기 (포트가 해제될 시간)
            sleep 3
            
            # 3. 새 버전 백그라운드 실행
            # 로그는 ~/app.log에 저장됩니다.
            nohup java -jar ~/Michelin_Back-0.0.1-SNAPSHOT.war > ~/app.log 2>&1 &
            
            # 4. 실행 확인 (선택 사항)
            echo "Server restarted with PID: $(pgrep -f Michelin_Back-0.0.1-SNAPSHOT.war)"
          EOF